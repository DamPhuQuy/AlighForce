# AlignForge Model Configuration (~3M parameters)
model:
  vocab_size: 2048
  max_seq_len: 128
  d_model: 256
  n_heads: 4
  n_layers: 4
  d_ff: 1024
  dropout: 0.1
  norm_eps: 1e-5
  rope_base: 10000.0

training:
  seed: 42
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
