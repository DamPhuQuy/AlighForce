[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alignforge"
version = "0.1.0"
description = "A Lightweight English Writing Coach Built on a From-Scratch Decoder-Only Language Model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "datasets>=2.18.0",
    "pytest>=8.0.0",
]

[project.scripts]
alignforge = "alignforge.presentation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alignforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
